name: RefundFlow CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: refundflow-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            install_mode: resolved
          - os: ubuntu-latest
            python-version: "3.12"
            install_mode: resolved
          - os: ubuntu-latest
            python-version: "3.14"
            install_mode: resolved
          - os: windows-latest
            python-version: "3.14"
            install_mode: locked
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.install_mode == 'locked' && 'requirements-dev.lock' || 'pyproject.toml' }}

      - name: Install locked Windows environment
        if: matrix.install_mode == 'locked'
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Install project and development dependencies
        if: matrix.install_mode == 'resolved'
        run: python -m pip install -e ".[dev]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Lint
        run: python -m ruff check app tests

      - name: Compile sources
        run: python -m compileall -q app tests

      - name: Run tests
        run: python -m pytest -q
