[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refundflow"
version = "0.1.0"
description = "Customer refund-support workflow: LangGraph multi-agent with human-in-the-loop approvals, policy-grounded retrieval, deterministic tests."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2",
    "langgraph-prebuilt>=1.1",
    "langgraph-checkpoint>=4.3",
    "langgraph-checkpoint-sqlite>=3.1.3,<4.0",
    "aiosqlite>=0.22.1,<1.0",
    "mcp>=1.30.0,<2.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic-settings>=2.1",
    "pycasbin>=2.8.0,<3.0",
    "pypdf==6.4.1",
    "python-docx>=1.2.0,<2.0",
    "lxml>=6.1.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.17.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["dev_identities.json"]
